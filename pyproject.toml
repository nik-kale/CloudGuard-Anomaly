[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudguard-anomaly"
version = "0.1.0"
description = "Agentic Cloud Security Posture & Anomaly Analyzer"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "CloudGuard-Anomaly Contributors"}
]
keywords = [
    "cloud security",
    "security posture",
    "anomaly detection",
    "configuration drift",
    "cspm",
    "aws",
    "azure",
    "gcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "click>=8.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.0.285",
    "mypy>=1.5.0",
]
# Web dashboard, REST API and database storage
dashboard = [
    "sqlalchemy>=2.1.0",
    "alembic>=1.12.0",
    "psycopg[binary]>=3.2.0",
    "flask>=3.0.0",
    "flask-socketio>=5.3.0",
    "flask-limiter>=3.5.0",
    "flask-caching>=2.1.0",
    "flask-cors>=4.0.0",
    "flask-wtf>=1.2.0",
    "python-json-logger>=2.0.7",
    "prometheus-client>=0.19.0",
]
aws = ["boto3>=1.28.0"]
pdf = ["reportlab>=4.0.0"]
iac = ["python-hcl2>=4.3.0"]
ml = ["scikit-learn>=1.3.0", "numpy>=1.24.0", "joblib>=1.3.0", "python-dateutil>=2.8.0"]

[project.urls]
Homepage = "https://github.com/nik-kale/CloudGuard-Anomaly"
Documentation = "https://github.com/nik-kale/CloudGuard-Anomaly#readme"
Repository = "https://github.com/nik-kale/CloudGuard-Anomaly"
Issues = "https://github.com/nik-kale/CloudGuard-Anomaly/issues"

[project.scripts]
cloudguard-anomaly = "cloudguard_anomaly.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cloudguard_anomaly*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
cloudguard_anomaly = ["policies/*.yaml", "dashboard/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--verbose --cov=cloudguard_anomaly --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
